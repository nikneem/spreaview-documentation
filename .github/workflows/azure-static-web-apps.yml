name: Deploy Docs to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

# OIDC / federated-credential login needs id-token: write.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  HUGO_VERSION: "0.128.0"
  AZURE_LOCATION: westeurope
  AZURE_RESOURCE_GROUP: rg-spreaview-docs
  SWA_NAME: stapp-spreaview-docs
  CUSTOM_DOMAIN: docs.spreaview.com

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Docsy dependencies
        working-directory: ./src
        run: npm install --save-dev autoprefixer postcss-cli

      - name: Install Docsy Node.js dependencies
        working-directory: ./src/themes/docsy
        run: npm i

      - name: Build with Hugo
        working-directory: ./src
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Provisioning only runs for the production branch / manual runs.
      # Both commands are idempotent, so re-runs are safe.
      - name: Provision resource group and Static Web App (Free tier)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION"

          az staticwebapp create \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --sku Free

      - name: Read Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "deployment_token=$token" >> "$GITHUB_OUTPUT"

          default_host=$(az staticwebapp show \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "defaultHostname" -o tsv)
          echo "default_host=$default_host" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.deployment_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub PR preview comments
          action: upload
          app_location: ./src/public # Pre-built Hugo output
          api_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Bind custom domain
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "DNS record required at your DNS provider for ${CUSTOM_DOMAIN}:"
          echo "  CNAME  ${CUSTOM_DOMAIN}.  ->  ${{ steps.swa.outputs.default_host }}"
          # Registers the hostname; validation completes once the CNAME above resolves.
          az staticwebapp hostname set \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --hostname "$CUSTOM_DOMAIN" \
            --validation-method cname-delegation \
            --no-wait || true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Close Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC federated credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "deployment_token=$token" >> "$GITHUB_OUTPUT"

      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.deployment_token }}
          action: close
